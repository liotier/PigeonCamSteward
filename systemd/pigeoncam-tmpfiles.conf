
# Install to /etc/tmpfiles.d/pigeoncam.conf, or apply immediately with:
#   sudo systemd-tmpfiles --create systemd/pigeoncam-tmpfiles.conf
#
# Creates the shared runtime directory that pigeoncam-stream.sh,
# pigeoncam-watchdog.sh, pigeoncam-status-check.sh, and pigeoncam-rotate.sh all
# use for ffmpeg's -progress file (FR7) and their own small state/marker
# files. Deliberately not a per-unit systemd RuntimeDirectory=, since that
# ties the directory's lifetime to a single unit; several independent
# units share this one and any of them may be the first to start.
d /run/pigeoncam 0750 root root -

# The persistent counterpart. Holds state that must survive a reboot: the
# last-rotation timestamp (so a reboot can't make an overdue broadcast
# look freshly rotated) and, if the YouTube API integration is enabled,
# its record of the current broadcast. Created here so it always has the
# same ownership and permissions, rather than inheriting whatever umask
# the first process to need it happened to run with. Never cleaned up
# automatically - the whole point is that it persists.
d /var/lib/pigeoncam 0750 root root -
