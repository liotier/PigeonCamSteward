# PigeonCamSteward configuration template.
#
# Copy this file to config.yaml (next to it, or to /etc/pigeoncam/config.yaml
# for a systemd-managed deployment) and edit it. config.yaml is git-ignored;
# never commit a real deployment's copy.
#
# Every bin/pigeoncam-*.sh script reads its tunables from here via `yq`
# (Debian/Ubuntu package "yq" - the kislyuk/yq wrapper around jq, NOT
# mikefarah/yq; same filter syntax as jq). Validate this file parses with:
#   yq . config.yaml >/dev/null && echo OK

# location (optional): only used by the solar-relative scheduling modes
# below (youtube.rotation.schedule: solar, archive.daytime_mode: solar).
# Leave both empty to leave those modes off - everything else in this file
# works without this block. Solar noon/sunrise/sunset are computed locally
# from these coordinates and the system clock; no network call, no
# external almanac service. See docs/development/design/solar-scheduling.md.
location:
  latitude: ""                    # decimal degrees, e.g. 48.8566 (positive = north)
  longitude: ""                   # decimal degrees, e.g. 2.3522 (positive = east)

camera:
  device: /dev/pigeoncam            # stable udev symlink, not /dev/videoN - see udev/99-pigeoncam.rules.example
  input_format: mjpeg             # mjpeg, not yuyv - see docs/TROUBLESHOOTING.md
  resolution: "1920x1080"
  framerate: 30
  thread_queue_size: 512          # ffmpeg's -thread_queue_size on the v4l2 input, ahead of
                                   # the MJPEG software decode (SPEC.md Appendix A). Raise it
                                   # if ffmpeg logs "Thread message queue blocking" under load.

encode:
  preset: veryfast
  tune: ""                        # empty = none. "zerolatency" was field-tested and works,
                                   # but costs compression efficiency (disables lookahead)
                                   # for a latency benefit that is irrelevant to this
                                   # content - nobody needs sub-second latency on a nest.
                                   # Leave empty unless CPU headroom is tight.
  bitrate_kbps: 6000
  maxrate_kbps: 6000              # for cbr: true (below), keep this equal to bitrate_kbps
  bufsize_kbps: 12000
  cbr: true                       # true constant bitrate: x264 pads with filler NAL units
                                   # rather than undershooting when the scene compresses
                                   # well. Load-bearing for a nest cam, which is at its
                                   # darkest and most static exactly when nobody is around
                                   # to notice it break: measured on a static dark 1080p30
                                   # source with these same settings, x264's default rate
                                   # control delivered 23 kbps against the 6000 kbps target
                                   # (~260x short), which YouTube's ingest reports as "not
                                   # receiving enough video to maintain smooth streaming"
                                   # and viewers see as the stream cutting in and out.
                                   # Costs bandwidth AND archive disk around the clock (the
                                   # tee writes this same stream to both), since a quiet
                                   # night hour now weighs as much as a busy noon one -
                                   # run pigeoncam-doctor.sh to check free space after
                                   # enabling. Set false only if that trade is wrong for
                                   # your link or your disk.

audio:
  mode: synthetic                 # synthetic | real | off - see SPEC.md §3 before using "off"
  synthetic_amplitude: 0.001
  sample_rate: 48000               # also used for `real` mode - match your actual device's
                                   # native rate (`pactl list sources`) if you switch to real,
                                   # rather than leaving this at the synthetic default
  bitrate_kbps: 128                # AAC -b:a (SPEC.md Appendix A). This is a nest cam, not
                                   # a music stream - 128 is already generous for either the
                                   # synthetic noise floor or a real ambient-audio source.
  real_source: ""                 # e.g. alsa_input.usb-...analog-stereo (Pulse) - only used if mode: real
  real_source_user: ""            # system username whose PipeWire/PulseAudio session owns real_source -
                                   # only used if mode: real. Every unit in this project runs as root
                                   # which has no audio session of its own; PipeWire/PulseAudio
                                   # sessions are per-user, so leave this empty ONLY if you've separately
                                   # arranged for root to have its own working session (uncommon). The
                                   # normal case: set this to whichever logged-in user's `pactl list
                                   # sources short` actually lists real_source. See docs/TROUBLESHOOTING.md
                                   # "Real audio mode" for the loginctl enable-linger step this may need.

youtube:
  ingest_url: "rtmps://a.rtmps.youtube.com/live2"   # RTMPS, not RTMP - click the lock icon in Studio
  stream_key_file: /etc/pigeoncam/stream_key           # chmod 600, never in git
  rotation:
    mode: restart                 # restart (default, needs no credentials) | api (needs YouTube
                                  # account access - see the youtube_api: block at the end of this file)
    schedule: interval            # interval (default): a plain repeating cycle, checked every
                                   # 5 minutes but only acted on once `interval` below has
                                   # genuinely elapsed since the last rotation - see
                                   # docs/TROUBLESHOOTING.md "Rotation says 'not due yet'".
                                   # solar: one maximum-length broadcast centred on solar noon
                                   # (needs location.longitude above), plus two shorter
                                   # broadcasts splitting the night at solar midnight - see
                                   # docs/development/design/solar-scheduling.md. Falls back to
                                   # interval, with a logged warning, if location.longitude
                                   # isn't set - a bad location can never stop rotation itself.
    interval: "11h45m"            # interval mode: the repeat cycle. solar mode: the width of
                                   # the daytime slice (and the ceiling nothing may exceed) -
                                   # either way, keep it under YouTube's ~12h continuous-archive
                                   # limit; pigeoncam-doctor.sh warns if it isn't.
    min_gap_seconds: 150          # restart mode only: deliberate stop->start gap.
                                   # Field-measured: ~100s reliably forces a new
                                   # broadcast; shorter gaps resume the old one and
                                   # do NOT reset the 12h archive clock. Keep margin.

archive:
  enabled: true
  segment_dir: /var/lib/pigeoncam/archive
  segment_length_seconds: 3600
  segment_format: mpegts           # crash-tolerant. mp4 loses the
                                   # in-progress segment on any crash.
  daytime_mode: fixed              # fixed (default): daytime_start/daytime_end below, exactly
                                   # the same clock hours every day of the year.
                                   # solar: daytime is wherever the sun is actually above
                                   # solar_altitude_degrees (needs location.latitude/longitude
                                   # above) - shrinks and grows with the real season instead of
                                   # staying fixed. Falls back to fixed, with a logged warning,
                                   # if location isn't set - a bad location can never stop this
                                   # gate from working. See
                                   # docs/development/design/solar-scheduling.md.
  daytime_start: "04:00"
  daytime_end: "20:30"            # used when daytime_mode: fixed. Trim/discard decisions are
                                   # per whole hour, not per minute - a non-hour-aligned value
                                   # (including this default's :30) rounds the boundary hour
                                   # toward daytime, see docs/TROUBLESHOOTING.md "Archive
                                   # retention rounds to whole hours"
  solar_altitude_degrees: -12      # used when daytime_mode: solar. -0.833 = actual
                                   # sunrise/sunset, -6 = civil twilight, -12 = nautical
                                   # twilight (default - a bit more generous than sunrise/
                                   # sunset, on the same reasoning nighttime_discard already
                                   # uses: a little extra dim footage costs little, missing
                                   # real dawn/dusk activity costs more)
  daytime_keep_minutes: 60         # minutes retained per hour, 1-60, summed across
                                   # that hour's segments (restarts split hours into
                                   # several files), oldest-first
  nighttime_discard: true          # false: trim nighttime hours to daytime_keep_minutes
                                   # instead of discarding them outright (still no separate
                                   # nighttime budget key - same minutes-per-hour value)

# notify_command (optional, empty = disabled): a command run whenever a
# genuine escalation happens - a USB-level device reset, automatic YouTube
# API recovery, or the last-resort "manual Studio intervention may be
# required" case - not on every routine automatic restart, which would be
# too noisy for a notification channel to stay useful. Invoked as
# `sh -c "$notify_command" sh LABEL MESSAGE`, so LABEL/MESSAGE are
# available as $1/$2 inside your command if you reference them (e.g. a
# one-liner piping into curl/mail/notify-send); anything more elaborate is
# easiest as your own small wrapper script pointed to here. Best-effort:
# a failing or slow (>10s) notify_command is logged as a warning but never
# affects the escalation itself.
notify_command: ""

watchdog:
  check_interval_seconds: 30
  stall_timeout_seconds: 60
  progress_file: /run/pigeoncam/progress   # ffmpeg -progress target. Also
                                          # fixes the shared runtime directory
                                          # (/run/pigeoncam) every script uses
                                          # for its own state/marker files.
  usb_reset:
    enabled: true
    escalate_after_restarts: 1      # plain restarts to try before escalating
    method: uhubctl                 # uhubctl | unbind | usbreset - starting preference;
                                     # falls through uhubctl -> unbind -> usbreset from
                                     # whichever is configured, in a fixed order
    hub_location: ""                # uhubctl -l value, only used if method: uhubctl
    port: ""                        # port number on that hub
    usb_path: ""                    # bus-port id (e.g. "3-4.1.4"), used by unbind/bind
                                     # and usbreset fallbacks. Leave empty to derive it
                                     # at runtime from camera.device's udev/sysfs path
                                     # instead of hardcoding a bus number that can change
                                     # across reboots even when the physical port doesn't.
    cooldown_seconds: 300           # minimum time between two USB-level resets; a stall
                                     # a reset genuinely can't fix would otherwise
                                     # re-trigger a USB reset every other watchdog check
                                     # indefinitely. Blocked escalations still fall back
                                     # to a plain service restart, they just don't
                                     # re-trigger the more disruptive device reset.
  frame_freeze:
    # Camera-side counterpart to external_check.frame_freeze below: the
    # frame= counter above only proves ffmpeg is still receiving *something*
    # from the camera each interval, not that the actual pixel content is
    # changing - a USB/sensor fault that leaves the device technically
    # responsive but stuck redelivering the same frame would still advance
    # frame= normally, since ffmpeg has no way to know the frame is stale.
    #
    # When enabled, pigeoncam-stream.sh adds a second, independent ffmpeg
    # output that overwrites one JPEG snapshot on disk every
    # snapshot_interval_seconds (also handy on its own: scp/sshfs the file
    # to see exactly what the camera currently sees). This script hashes it
    # across samples; confirm_count consecutive identical hashes is treated
    # as a stall and feeds the exact same restart/USB-reset ladder as the
    # counter-based check above.
    #
    # !! KNOWN-HARMFUL AS SHIPPED - leave this false unless you are
    # !! actively working on it. With audio.mode: real, every emission of
    # !! the snapshot output below disrupts the audio pipeline: bursts of
    # !! ~40-60 "Non-monotonic DTS" corrections land on the exact second
    # !! of each snapshot write, once per snapshot_interval_seconds,
    # !! forever. Logs from before this output existed contain zero such
    # !! warnings. Viewers see the stream cutting in and out. Downscaling
    # !! the snapshot (below) does NOT fix it - the cause is not encode
    # !! cost. Full evidence and the leading suspect (the pulse input gets
    # !! no -thread_queue_size, so it sits on ffmpeg's default of 8
    # !! packets) are in docs/TROUBLESHOOTING.md "Non-monotonic DTS".
    #
    # Off by default - like external_check.frame_freeze, this adds a second
    # encode chain to the running ffmpeg process and is newer/less
    # field-proven, so opt in deliberately rather than by default. The
    # snapshot is downscaled before encoding (not configurable - it only
    # ever needs to be big enough to hash-compare and to eyeball "is the
    # camera still pointed at the nest"), which keeps its cost negligible
    # inside the live streaming process.
    enabled: false
    snapshot_path: /run/pigeoncam/last_frame.jpg
    snapshot_interval_seconds: 60   # how often pigeoncam-stream.sh overwrites the snapshot
    confirm_count: 3                # consecutive identical snapshot hashes before treating
                                     # as frozen. A live sensor's own read noise changes the
                                     # hash even on a genuinely motionless scene (an
                                     # incubating bird can hold still for a long time), the
                                     # same reasoning that makes external_check.frame_freeze
                                     # safe below - only a truly stuck feed produces
                                     # byte-identical output across samples.
    # Restricted to archive.daytime_start/daytime_end (reused, not
    # duplicated), same rationale as external_check.frame_freeze: a
    # near-dark nighttime frame is expected to hash identical across
    # samples even from a genuinely live camera.

external_check:
  enabled: true
  method: yt-dlp                    # yt-dlp (no credentials) | api (quota-based alternative,
                                     # NOT IMPLEMENTED - secondary to the YouTube API's two
                                     # core uses (api-mode rotation, stuck-broadcast recovery), both of
                                     # which this project does implement; setting this to `api` makes
                                     # bin/pigeoncam-status-check.sh log a clear error and treat every poll as
                                     # indeterminate rather than silently keep using yt-dlp anyway)
  channel_live_url: "https://www.youtube.com/@YOUR_HANDLE/live"
  yt_dlp_timeout_seconds: 30        # hard timeout on each yt-dlp call so a hung
                                     # extraction can't wedge the polling timer
  poll_interval_seconds: 180
  grace_period_after_restart_seconds: 300   # suppress alerts this long after any (re)start
  grace_period_after_rotation_seconds: 480  # must exceed rotation min_gap_seconds plus
                                             # YouTube's own go-live latency
  max_restarts_before_escalation: 3         # restarts before escalating
  backoff_ceiling_seconds: 1800             # max restart backoff once escalation
                                             # is exhausted or unavailable
  indeterminate_alert_after: 20             # notify_command fires once every this many
                                             # CONSECUTIVE indeterminate polls (~1h at the
                                             # default poll_interval_seconds), then re-arms
                                             # rather than repeating - a multi-day outage of
                                             # this check produces one notice per threshold,
                                             # not one per poll. 0 disables the alert.
                                             # Deliberately takes no action (no restart, no
                                             # escalation) - "indeterminate never acts"
                                             # is unchanged; this only reports that THIS
                                             # health layer has gone blind (a broken yt-dlp,
                                             # a persistent network fault, a YouTube frontend
                                             # change), which previously had no notification
                                             # at all, only a journal nobody was reading.
  frame_freeze:
    # Closes a real blind spot: a broadcast can report confirmed-live (a
    # bound stream YouTube says is active) while YouTube's own relay to
    # viewers is actually stuck replaying stale content - local frame
    # progress and the is_live check just above both look completely
    # healthy in that case, since neither can see YouTube's own relay
    # state. Field-motivated: an unrelated fault (rotation silently failing
    # for days - see docs/YOUTUBE-API.md) let one broadcast run ~8x past
    # YouTube's ~12h ceiling, which most likely triggered exactly this.
    #
    # Off by default - unlike the is_live check (a lightweight JSON call),
    # this fetches and decodes real video data every sample, a meaningfully
    # larger bandwidth/CPU cost worth opting into deliberately.
    enabled: false
    check_interval_seconds: 1800      # how often to actually sample a frame - much
                                       # less often than poll_interval_seconds above,
                                       # given the real per-sample cost
    confirm_count: 2                  # consecutive identical decoded-frame hashes
                                       # required before treating the stream as frozen
    fetch_timeout_seconds: 20         # bounded timeout for both the yt-dlp URL
                                       # resolution and the ffmpeg frame grab
    # Only ever samples within archive.daytime_start/daytime_end (reused,
    # not duplicated here) - near-dark nighttime frames carry far less real
    # sensor noise to begin with, and a rate-controlled encoder quantizes
    # away most of what little remains, so identical hashes at night are
    # expected even from genuinely live video and would otherwise be a
    # false positive. A stuck stream that starts or persists purely
    # overnight isn't caught by this check until daytime_start - not a
    # regression (nothing else catches that case at any hour either), and
    # consistent with nighttime_discard's existing "nighttime footage is
    # lower-priority" stance.

reencode:
  enabled: false
  codec: libx265
  preset: faster
  crf: 26

# Connecting your YouTube account (optional).
#
# Everything above works without this. Turning it on buys two things:
#   - cleaner scheduled rotation: the system asks YouTube directly to end
#     one broadcast and begin the next, instead of stopping the stream and
#     hoping YouTube notices;
#   - automatic recovery from a broadcast wedged at "Preparing stream",
#     which no number of plain restarts will clear.
#
# Needs a one-time Google Cloud OAuth setup and its own Python venv
# (api/venv/). Walkthrough: docs/YOUTUBE-API.md.
youtube_api:
  enabled: false
  client_secret_file: /etc/pigeoncam/youtube_api_client_secret.json  # from Google Cloud Console, chmod 600, never in git
  token_file: /etc/pigeoncam/youtube_api_token.json                  # written by `api/rotate_via_api.py --authorize`, chmod 600, never in git
  persistent_stream_id: ""          # the liveStreams resource id to bind new broadcasts to -
                                     # find it in Studio's stream settings, or via
                                     # `api/rotate_via_api.py --list-streams` after authorizing
  broadcast_title: "Nest camera - live"
  broadcast_description: ""
  privacy_status: public            # public | unlisted | private
  category_id: ""                   # empty = leave unset (channel/account default applies).
                                     # e.g. "15" = Pets & Animals - see
                                     # https://developers.google.com/youtube/v3/docs/videoCategories/list
  made_for_kids: null               # true | false | null (null = don't send the field,
                                     # let the channel/account default apply)
  poll_stream_active_timeout_seconds: 120   # how long to wait for liveStreams.status.streamStatus
                                             # == active (step 5) before giving up on this rotation
  poll_stream_active_interval_seconds: 5
  state_file: /var/lib/pigeoncam/youtube_api_state.json   # tracks the current broadcast id across
                                                   # rotations/reboots - persistent storage,
                                                   # not /run (tmpfs)
  oauth_redirect_port: 8090         # local port `--authorize` listens on for the OAuth
                                     # redirect; forward it over SSH for a headless host
                                     # (ssh -L 8090:localhost:8090 ...)
  sweep_stray_broadcasts: true      # after each rotation, close any OTHER broadcast still
                                     # live on the channel. Closes a structural gap in the
                                     # rotation sequence rather than a hypothetical one:
                                     # rotation can only ever close the broadcast that is
                                     # still BOUND to the persistent stream (that is the
                                     # only handle either local state or --recover's
                                     # discovery has on it), but binding a new broadcast
                                     # unbinds the previous one - so any broadcast whose
                                     # own close failed becomes permanently invisible and
                                     # stays live forever. Field-observed 2026-08-02: one
                                     # such orphan survived two consecutive rotations,
                                     # collected all the viewers while receiving no data,
                                     # and won the channel's /live redirect, so the
                                     # external health check spent the night confirming
                                     # "live" against a broadcast that wasn't ours.
                                     # Assumes this channel is dedicated to this camera
                                     # (as SPEC.md describes) - set false if the same
                                     # channel also carries unrelated live broadcasts,
                                     # which this would otherwise end too.
